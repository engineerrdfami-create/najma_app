name: Flutter Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create and Setup Project
        run: |
          # 1. إنشاء مشروع فلاتر نظيف وحقيقي
          flutter create --org com.najma.app --project-name najma_app najma_project
          
          # 2. مسح ملف main الافتراضي وتجهيز المجلد
          rm -f najma_project/lib/main.dart
          
          # 3. نسخ كافة ملفاتك البرمجية السبعة والأيقونات بدقة إلى المشروع الجديد
          cp -rf lib/* najma_project/lib/
          
          # 4. الانتقال وبناء التطبيق من مجلد المشروع المستقر
          cd najma_project
          flutter pub get
          flutter build apk --release
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: najma-app-release
          path: najma_project/build/app/outputs/flutter-apk/app-release.apk

