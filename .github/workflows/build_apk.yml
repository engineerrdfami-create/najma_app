name: Flutter Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Build Global Android Structure and Merge Code
        run: |
          mkdir -p backup_code
          cp -r *.dart backup_code/ 2>/dev/null || true
          cp -r lib/* backup_code/ 2>/dev/null || true
          rm -rf * .git .github || true
          flutter create . --org com.najma.app --project-name najma_app --force
          mkdir -p .github/workflows
          cp -r backup_code/* lib/ 2>/dev/null || true
          
          cat << 'INNER_EOF' > pubspec.yaml
          name: najma_app
          description: "منصة نجمة المتكاملة ومحفظة StarPay السحابية"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.2
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^2.0.0
          flutter:
            uses-material-design: true
          INNER_EOF
          
      - name: Fetch Dependencies
        run: flutter pub get
        
      - name: Build APK Release
        run: flutter build apk --release
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: najma-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
