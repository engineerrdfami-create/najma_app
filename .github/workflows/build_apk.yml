name: Flutter Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create and Setup Project
        run: |
          flutter create --org com.najma.app --project-name najma_app najma_project
          rm -f najma_project/lib/main.dart
          cp -rf lib/* najma_project/lib/
          
          cat << 'INNER_EOF' > najma_project/lib/main_navigation.dart
          import 'package:flutter/material.dart';
          import 'star_chat.dart';
          import 'starpay_wallet.dart';
          import 'star_market.dart';
          import 'star_live.dart';
          import 'najma_reels.dart';

          class MainNavigation extends StatefulWidget {
            const MainNavigation({super.key});
            @override
            State<MainNavigation> createState() => _MainNavigationState();
          }

          class _MainNavigationState extends State<MainNavigation> {
            int _currentIndex = 0;
            final List<Widget> _screens = [
              const StarChat(),
              const NajmaReels(),
              const StarLive(),
              const StarMarket(),
              const StarPayWallet(),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0D0D0D),
                body: IndexedStack(index: _currentIndex, children: _screens),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  onTap: (index) => setState(() => _currentIndex = index),
                  type: BottomNavigationBarType.fixed,
                  backgroundColor: Colors.white.withOpacity(0.04),
                  selectedItemColor: Colors.greenAccent,
                  unselectedItemColor: Colors.white38,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.chat), label: 'الدردشة'),
                    BottomNavigationBarItem(icon: Icon(Icons.video_library), label: 'الريلز'),
                    BottomNavigationBarItem(icon: Icon(Icons.live_tv), label: 'البث'),
                    BottomNavigationBarItem(icon: Icon(Icons.store), label: 'المتجر'),
                    BottomNavigationBarItem(icon: Icon(Icons.wallet), label: 'المحفظة'),
                  ],
                ),
              );
            }
          }
          INNER_EOF

          cat << 'INNER_EOF2' > najma_project/lib/starpay_wallet.dart
          import 'package:flutter/material.dart';
          class StarPayWallet extends StatelessWidget {
            const StarPayWallet({super.key});
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0D0D0D),
                body: Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(Icons.account_balance_wallet, color: Colors.greenAccent, size: 60),
                      const SizedBox(height: 20),
                      Text('محفظة StarPay الرقمية', style: TextStyle(color: Colors.white, fontSize: 22, fontWeight: FontWeight.bold)),
                    ],
                  ),
                ),
              );
            }
          }
          INNER_EOF2

          sed -i 's/backgroundColor: const Color/backgroundColor: Color/g' najma_project/lib/star_chat.dart || true
          sed -i 's/leading: const Padding/leading: Padding/g' najma_project/lib/star_chat.dart || true

          cd najma_project
          flutter pub get
          flutter build apk --release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: najma-app-release
          path: najma_project/build/app/outputs/flutter-apk/app-release.apk
