name: Flutter Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create and Setup Project
        run: |
          # 1. إنشاء مشروع فلاتر نظيف وحقيقي في مجلد فرعي
          flutter create --org com.najma.app --project-name najma_app najma_project
          
          # 2. نقل ملفات الواجهات الأسطورية الخاصة بك إلى داخل مجلد الـ lib الجديد
          cp -f lib/* najma_project/lib/
          
          # 3. الانتقال إلى مجلد المشروع الجديد لتنفيذ البناء من داخله
          cd najma_project
          flutter pub get
          flutter build apk --release
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: najma-app-release
          path: najma_project/build/app/outputs/flutter-apk/app-release.apk

