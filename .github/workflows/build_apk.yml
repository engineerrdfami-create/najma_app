name: Flutter Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Setup Clean App and Organize Files
        run: |
          flutter create clean_holder_app --org com.najma.app --project-name najma_app --force
          rm -rf clean_holder_app/lib/*
          cp -r main.dart clean_holder_app/lib/ 2>/dev/null || true
          cp -r main_navigation.dart clean_holder_app/lib/ 2>/dev/null || true
          cp -r *.dart clean_holder_app/lib/ 2>/dev/null || true
          
      - name: Fetch Dependencies
        run: |
          cd clean_holder_app
          flutter pub get
        
      - name: Build APK Release
        run: |
          cd clean_holder_app
          flutter build apk --release
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: najma-app-release
          path: clean_holder_app/build/app/outputs/flutter-apk/app-release.apk
